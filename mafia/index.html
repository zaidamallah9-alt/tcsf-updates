:root{
  /* one night ramp, nothing else is grey */
  --n0:#0b0d12; --n1:#12151c; --n2:#191d26; --n3:#232834; --n4:#353c4c; --n5:#8f98ab; --n6:#cfd5e0;
  --paper:#f3eee3; --ink:#15171c;
  /* shop-sign enamels */
  --green:#1d6a49; --green-d:#0f3e2a; --red:#a62f29; --red-d:#5a1713;
  --cobalt:#2a4d9e; --cobalt-d:#152a5a; --ochre:#b37a22; --ochre-d:#5f3f0f;
  /* reserved: your move now */
  --sig:#f4c430; --sig-d:#7a5c08;
  --ok:#4fbf8a; --bad:#e2574c;
  --ui:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,system-ui,sans-serif;
  --sign:"Aref Ruqaa","Noto Naskh Arabic",serif;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--n0);color:var(--n6);font-family:var(--ui);font-size:16px;line-height:1.55;caret-color:var(--sig)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,rgba(244,196,48,.07),transparent 60%)}
::selection{background:var(--sig);color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--n4);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
#app{position:relative;max-width:520px;margin:0 auto;min-height:100%;padding:10px 14px 28px;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
.muted{color:var(--n5)} .center{text-align:center}
.spacer{flex:1;min-height:12px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.big{width:44px;height:44px;stroke-width:1.5}
.ic.huge{width:72px;height:72px;stroke-width:1.3}

/* ---------- sign boards ---------- */
.board{--b:var(--green);--bd:var(--green-d);position:relative;background:var(--b);border:2px solid var(--bd);border-radius:var(--r);padding:12px 16px 12px;color:var(--paper);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.8);
  background-image:radial-gradient(circle at 9px 9px,var(--bd) 2.2px,transparent 3px),radial-gradient(circle at calc(100% - 9px) 9px,var(--bd) 2.2px,transparent 3px),
    radial-gradient(circle at 9px calc(100% - 9px),var(--bd) 2.2px,transparent 3px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--bd) 2.2px,transparent 3px),
    linear-gradient(170deg,rgba(255,255,255,.08),rgba(0,0,0,.12))}
.board::after{content:"";position:absolute;inset:5px;border:1.5px solid rgba(243,238,227,.55);border-radius:2px;pointer-events:none}
.b-green{--b:var(--green);--bd:var(--green-d)} .b-red{--b:var(--red);--bd:var(--red-d)}
.b-cobalt{--b:var(--cobalt);--bd:var(--cobalt-d)} .b-ochre{--b:var(--ochre);--bd:var(--ochre-d)}
.sign{font-family:var(--sign);font-weight:700;line-height:1.15;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.28),0 3px 8px rgba(0,0,0,.25)}
.board .row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.board h1.sign{font-size:42px;line-height:1.35}
.board .sub{position:relative;z-index:1;font-size:14px;font-weight:600;color:rgba(243,238,227,.86)}
.plate{background:var(--paper);color:var(--ink);font-weight:800;font-size:20px;padding:2px 10px;border-radius:2px;direction:ltr;font-variant-numeric:tabular-nums;min-width:64px;text-align:center;box-shadow:inset 0 0 0 2px var(--bd)}
.plate:empty{display:none}
.plate.urgent{background:var(--sig)}
.util{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;color:var(--n5)}
.util b{color:var(--n6);letter-spacing:2px;direction:ltr;display:inline-block}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r);padding:14px 16px;margin:8px 0 0;font:inherit;font-weight:800;font-size:17px;cursor:pointer;
  background:var(--sig);color:var(--ink);box-shadow:inset 0 -3px 0 var(--sig-d),0 8px 18px -10px rgba(244,196,48,.55);transition:transform .12s ease-out,filter .12s}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--n3);color:var(--n6);box-shadow:inset 0 0 0 1px var(--n4)}
.btn.green{background:var(--green);color:var(--paper);box-shadow:inset 0 -3px 0 var(--green-d)}
.btn.small{display:inline-flex;width:auto;padding:8px 12px;font-size:14px;margin:0}
.btn:disabled{opacity:.45;cursor:default;filter:none;box-shadow:none}
.ghost{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--n4);color:var(--n5);border-radius:var(--r);padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ghost:hover{color:var(--n6);border-color:var(--n5)}
.ghost.danger{color:#f0a49d;border-color:#6e2a25}

/* ---------- inputs ---------- */
input[type=text],select{width:100%;padding:13px 14px;border-radius:var(--r);border:1px solid var(--n4);background:var(--n1);color:var(--paper);font:inherit}
input[type=text]::placeholder{color:var(--n5)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--sig)}
label.fld{display:block;font-size:13px;font-weight:700;color:var(--n5);margin:14px 0 6px}
.row{display:flex;gap:8px;align-items:stretch}
.row>input{flex:1}
.err{color:#ff9c91;text-align:center;margin-top:10px;font-weight:600}

/* ---------- house number plate (room code) ---------- */
.numplate{margin:12px auto 4px;display:inline-block;background:var(--cobalt);color:var(--paper);border:3px solid var(--paper);outline:2px solid var(--cobalt-d);border-radius:10px;padding:6px 22px 4px;
  font:800 40px/1.1 Consolas,"Courier New",monospace;letter-spacing:8px;direction:ltr;box-shadow:0 12px 24px -12px rgba(0,0,0,.9)}

/* ---------- the street (players as shop fronts) ---------- */
.street{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.street.mini{grid-template-columns:repeat(4,1fr);gap:6px}
.shop{--b:var(--green);--bd:var(--green-d);position:relative;display:flex;flex-direction:column;border:0;padding:0;margin:0;background:var(--n1);border-radius:var(--r);overflow:hidden;
  font:inherit;color:inherit;text-align:center;cursor:pointer;min-height:96px;box-shadow:0 0 0 1px var(--n3);transition:box-shadow .15s ease-out,transform .15s ease-out}
.c-green{--b:var(--green);--bd:var(--green-d)} .c-red{--b:var(--red);--bd:var(--red-d)} .c-cobalt{--b:var(--cobalt);--bd:var(--cobalt-d)} .c-ochre{--b:var(--ochre);--bd:var(--ochre-d)}
.shop-board{display:block;background:var(--b);color:var(--paper);font-weight:800;font-size:14px;padding:6px 6px 5px;border-bottom:2px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-board .ic{width:14px;height:14px;vertical-align:-2px;margin-inline-end:3px}
.shop-door{flex:1;position:relative;margin:6px 8px 0;border-radius:2px 2px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;
  background:linear-gradient(180deg,#3a2a12,#1a1309);color:#ffdc8a;font-size:12px;line-height:1.3}
.shop-door::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 0,rgba(255,196,90,.35),transparent 70%);pointer-events:none}
.shop.shut .shop-door{background:repeating-linear-gradient(180deg,#7d8593 0 5px,#535a67 5px 8px);color:var(--paper)}
.shop.shut .shop-door::before{background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.35))}
.shop-door .ic{width:26px;height:26px;position:relative}
.shop-door .who{position:relative;font-weight:700;background:rgba(11,13,18,.82);color:var(--paper);border-radius:2px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop .count{position:absolute;top:30px;left:5px;z-index:2;min-width:22px;height:22px;border-radius:2px;background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;line-height:22px;font-variant-numeric:tabular-nums}
.street.mini .shop{min-height:70px;cursor:default}
.street.mini .shop-board{font-size:12px;padding:4px 3px}
.street.mini .shop-door{margin:4px 6px 0}
.shop.dead .shop-board{background:var(--n3);border-color:var(--n2);color:var(--n5);text-decoration:line-through}
.shop.dead .shop-door{background:repeating-linear-gradient(180deg,#4a505c 0 5px,#343944 5px 8px);color:var(--n6)}
.shop.dead .shop-door::after{content:"";position:absolute;inset:18% 22%;background:linear-gradient(45deg,transparent 46%,var(--bad) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--bad) 46% 54%,transparent 54%);opacity:.85}
.shop.sel{box-shadow:0 0 0 3px var(--sig),0 10px 22px -10px rgba(244,196,48,.6);transform:translateY(-2px)}
.shop.sel .shop-door{background:linear-gradient(180deg,#5a4313,#2a1d08)}
.shop.sel.shut .shop-door{background:linear-gradient(180deg,#5a4313,#2a1d08);color:#ffe29a}
.shop:disabled{cursor:default;opacity:.4}
.shop.mark{box-shadow:0 0 0 2px var(--b)}
.skip{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;width:100%;margin-top:10px;padding:13px;border:2px dashed var(--n4);border-radius:var(--r);background:transparent;color:var(--n6);font:inherit;font-weight:800;cursor:pointer}
.skip .sub{flex-basis:100%;text-align:center;font-weight:500;color:var(--n5);font-size:13px}
.skip.sel{border-style:solid;border-color:var(--sig);color:var(--sig)}
.skip:disabled{opacity:.4;cursor:default}

/* ---------- your role: the shutter you lift ---------- */
.locker{position:relative;margin:10px 0 2px;height:78px;border-radius:var(--r);overflow:hidden;background:var(--n1);box-shadow:inset 0 0 0 1px var(--n3);cursor:pointer;user-select:none}
.locker-in{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--paper)}
.locker.mafia .locker-in{background:linear-gradient(90deg,rgba(166,47,41,.35),transparent)}
.locker.town .locker-in{background:linear-gradient(90deg,rgba(29,106,73,.35),transparent)}
.locker-in .sign{font-size:28px;line-height:1.5}
.locker-in .mates{font-size:13px;color:var(--n6)}
.locker .shut{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;gap:8px;font-size:13px;font-weight:700;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.2)),repeating-linear-gradient(180deg,#a3aab6 0 6px,#6d7482 6px 10px);
  transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.locker .shut span{background:var(--paper);padding:2px 10px;border-radius:2px;display:inline-flex;align-items:center;gap:6px}
.locker .shut::before{content:"";position:absolute;top:10px;left:50%;width:54px;height:7px;margin-left:-27px;border-radius:4px;background:#3c424e;box-shadow:inset 0 2px 2px rgba(0,0,0,.5)}
.locker.up .shut{transform:translateY(-100%)}
.deadtag{position:absolute;left:12px;top:10px;z-index:2;font-size:12px;font-weight:800;color:var(--paper);background:var(--red);padding:1px 8px;border-radius:2px}

/* ---------- text blocks ---------- */
.ask{font-size:21px;font-weight:800;color:var(--paper);margin:18px 0 10px}
.ask .ic{color:var(--sig);margin-inline-end:6px}
.note{font-size:13px;color:var(--n5);margin-top:8px}
.panel{background:var(--n1);border:1px solid var(--n3);border-radius:var(--r);padding:14px;margin-top:12px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--n5);margin:18px 0 8px}
.notice{position:relative;margin-top:14px;background:var(--paper);color:var(--ink);border-radius:2px;padding:14px 16px 12px;transform:rotate(-.6deg);box-shadow:0 12px 22px -12px rgba(0,0,0,.9)}
.notice::before,.notice::after{content:"";position:absolute;top:-7px;width:44px;height:16px;background:rgba(243,238,227,.55);border:1px solid rgba(0,0,0,.08)}
.notice::before{right:18px;transform:rotate(4deg)} .notice::after{left:18px;transform:rotate(-5deg)}
.notice .t{font-family:var(--sign);font-weight:700;font-size:22px;color:var(--red-d);margin-bottom:4px}
.notice .item{padding:5px 0;border-top:1px dashed rgba(21,23,28,.2);font-size:15px}
.notice .item:first-of-type{border-top:0}
.notice .ic{color:var(--red)}
.result{margin-top:14px}
.tally{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--n3);font-variant-numeric:tabular-nums}
.tally:first-child{border-top:0}
.tally b{color:var(--paper)}
.verdict{display:flex;align-items:center;gap:14px}
.verdict .sign{font-size:30px;line-height:1.45}

/* ---------- lists & settings ---------- */
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--n1);border:1px solid var(--n3);border-radius:var(--r);padding:9px 12px}
.pitem .n{flex:1;font-weight:700;color:var(--paper)}
.pitem .ic{width:16px;height:16px;color:var(--sig)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--n4);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(79,191,138,.18)}
.kick{background:none;border:0;color:var(--n5);cursor:pointer;padding:4px;margin-inline-start:14px}
.kick:hover{color:var(--bad)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--n1);border:1px solid var(--n3);border-radius:var(--r);padding:9px 12px;margin-top:6px;color:var(--n6)}
.set>span{display:flex;align-items:center;gap:8px}
.set .ic{color:var(--n5)}
.set select{width:auto;padding:6px 8px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--n4);background:var(--n2);color:var(--paper);font-size:20px;cursor:pointer}
.step .v{min-width:20px;text-align:center;font-weight:800;color:var(--paper);font-variant-numeric:tabular-nums}
.sw{width:46px;height:26px;border-radius:13px;background:var(--n4);position:relative;flex:none;cursor:pointer;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:.15s}
.sw.on{background:var(--green)} .sw.on::after{right:23px}
ul.rules{padding-right:18px;margin:6px 0} ul.rules li{margin:5px 0}
.rules-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--paper);margin:14px 0 4px}

/* ---------- chat ---------- */
.chat{background:var(--n1);border:1px solid var(--n3);border-radius:var(--r);padding:8px 10px;max-height:210px;overflow-y:auto;font-size:15px}
.chat .m{margin:3px 0;color:var(--n6)} .chat .m b{color:var(--paper)} .chat .sys{color:var(--n5);font-size:13px}
.chat.mafia{border-color:var(--red-d);background:linear-gradient(180deg,rgba(166,47,41,.12),transparent 60%),var(--n1)}
.chat.mafia b{color:#ff9c91}
.composer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--n1);border-top:1px solid var(--n3);padding:8px 12px;display:flex;gap:8px;z-index:8}
.composer input{flex:1}
.composer .btn{width:auto;margin:0}
body.hascomp #app{padding-bottom:84px}

/* ---------- voice strip ---------- */
.voicebar{max-width:520px;margin:8px auto 0;padding:0 14px}
.voicebar .vrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.voicebar .vstat{font-size:12px;color:var(--n5);flex:1;min-width:120px}
.vpeers{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:2px;background:var(--n2);border:1px solid var(--n3);color:var(--n6)}
.vchip .ic{width:14px;height:14px}
.vchip.talk{border-color:var(--ok);color:var(--paper);box-shadow:0 0 0 2px rgba(79,191,138,.25)}
.vchip.off{opacity:.4}
.btn.mic-on{background:var(--green);color:var(--paper);box-shadow:inset 0 -3px 0 var(--green-d)}
.btn.mic-off{background:var(--n3);color:#ff9c91;box-shadow:inset 0 0 0 1px #6e2a25}

/* ---------- connection banner ---------- */
.net{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:var(--paper);font-size:13px;font-weight:700;padding:5px}

/* ---------- the night curtain (signature) ---------- */
#curtain{position:fixed;inset:0;z-index:15;pointer-events:none;transform:translateY(-101%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:22vh;
  background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.45)),repeating-linear-gradient(180deg,#8b929e 0 7px,#5b6270 7px 12px)}
#curtain::after{content:"";position:absolute;bottom:0;left:0;right:0;height:16px;background:#3a404c;box-shadow:0 -2px 0 #9aa1ad}
#curtain .board{min-width:220px;text-align:center}
#curtain .board h1{font-size:46px}
#curtain.run{animation:curtain 2.1s cubic-bezier(.3,.7,.2,1) both}
@keyframes curtain{0%{transform:translateY(-101%)}28%{transform:translateY(0)}72%{transform:translateY(0)}100%{transform:translateY(-101%)}}
@media (prefers-reduced-motion:reduce){#curtain.run{animation:none}.locker .shut,.shop{transition:none}}

/* ---------- home ---------- */
.hang{position:relative;margin:34px auto 6px;width:min(300px,86%)}
.hang::before,.hang::after{content:"";position:absolute;top:-30px;width:2px;height:32px;background:linear-gradient(var(--n4),var(--n5))}
.hang::before{right:22%} .hang::after{left:22%}
.hang .board{text-align:center;padding:16px 10px 12px}
.hang h1.sign{font-size:60px;line-height:1.55}
.hang .sub{margin-top:2px}
.tag-line{text-align:center;color:var(--n5);margin:8px 0 14px}
.bigicon{display:flex;justify-content:center;color:var(--paper);margin:18px 0 6px}

/* ---------- the living derb ---------- */
.scene{position:relative;height:250px;margin:4px 14px 12px;max-width:480px;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(#1b2433,#121826 60%,#0f141e);border:1px solid var(--n2);transition:background 1.2s ease}
.scene.ph-day,.scene.ph-lobby,.scene.ph-end{background:linear-gradient(#3d5f86,#5b7ea3 55%,#2a3546)}
.scene.ph-vote,.scene.ph-voteResult{background:linear-gradient(#6b4a3a,#8a5d3f 55%,#2c2622)}
.scene::after{content:"";position:absolute;left:0;right:0;top:64px;bottom:64px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 26px,rgba(255,255,255,.03) 26px 52px);pointer-events:none}
.sky{position:absolute;inset:0;pointer-events:none}
.sky .moon,.sky .sun{position:absolute;top:58px;left:calc(50% + 64px);width:16px;height:16px;border-radius:50%;transition:opacity 1s,transform 1.4s cubic-bezier(.3,.7,.2,1)}
.sky .moon{background:#e9e4d4;box-shadow:inset -6px -2px 0 #b9b39f}
.sky .sun{background:var(--sig);box-shadow:0 0 18px rgba(244,196,48,.6);opacity:0;transform:translateY(30px)}
.ph-day .sky .moon,.ph-lobby .sky .moon,.ph-end .sky .moon,.ph-vote .sky .moon,.ph-voteResult .sky .moon{opacity:0;transform:translateY(30px)}
.ph-day .sky .sun,.ph-lobby .sky .sun,.ph-end .sky .sun,.ph-vote .sky .sun,.ph-voteResult .sky .sun{opacity:1;transform:none}
.sky .st{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s ease-in-out infinite}
.sky .s1{top:82px;right:30px}.sky .s2{top:100px;right:70px;animation-delay:-1s}.sky .s3{top:150px;left:50px;animation-delay:-2s}
.scene:not(.ph-night) .sky .st{opacity:0;animation:none}
@keyframes tw{50%{opacity:.15}}

.hall{position:absolute;left:50%;top:50%;width:min(52%,210px);height:92px;transform:translate(-50%,-50%);z-index:1}
.hall-sign{position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:var(--green);border:2px solid rgba(243,238,227,.5);border-radius:3px;padding:0 10px;z-index:2;white-space:nowrap}
.hall-sign .sign{font-size:17px;line-height:1.5}
.hall-body{position:absolute;inset:6px 0 0;background:#e8dcc4;border-radius:46% 46% 4px 4px/34% 34% 4px 4px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08);overflow:hidden}
.hall .arch{position:absolute;left:50%;bottom:0;width:44%;height:62%;transform:translateX(-50%);background:#2b2118;border-radius:50% 50% 0 0/40% 40% 0 0;transition:background 1s}
.ph-vote .hall .arch,.ph-voteResult .hall .arch{background:#5a3c22}
.hall .table{position:absolute;left:50%;bottom:10px;width:40%;height:12px;transform:translateX(-50%);background:#8b5a2b;border-radius:50%;opacity:0;transition:opacity .8s .6s}
.ph-vote .hall .table,.ph-voteResult .hall .table{opacity:1}
.hall .lamp{position:absolute;left:50%;top:30%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--sig);box-shadow:0 0 14px 4px rgba(244,196,48,.5);opacity:0;transition:opacity .8s}
.ph-vote .hall .lamp,.ph-voteResult .hall .lamp,.ph-night .hall .lamp{opacity:1}

.sshop{position:absolute;height:64px;z-index:1}
.sshop .sb{display:block;height:16px;padding:0 3px;font-size:10px;font-weight:800;line-height:16px;text-align:center;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px;background:var(--tn)}
.sshop.c-green{--tn:var(--green)}.sshop.c-red{--tn:var(--red)}.sshop.c-cobalt{--tn:var(--cobalt)}.sshop.c-ochre{--tn:var(--ochre)}
.sshop .sdoor{position:absolute;left:8%;right:8%;top:18px;bottom:0;background:#120f0c;border-radius:2px 2px 0 0;overflow:hidden}
.sshop .sdoor::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,rgba(244,196,48,.35),transparent 70%);opacity:0;transition:opacity .9s .6s}
.scene:not(.ph-night) .sshop:not(.dead) .sdoor::before{opacity:1}
.sshop .sshut{position:absolute;left:8%;right:8%;top:18px;bottom:0;transform-origin:top;transform:scaleY(0);transition:transform .9s cubic-bezier(.5,0,.2,1);
  background:repeating-linear-gradient(#8a919d 0 3px,#6b717c 3px 6px);border-bottom:2px solid #3a404c;z-index:3}
.sshop.shut .sshut{transform:scaleY(1)}
.sshop .grave{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--n6);z-index:4}
.sshop.dead .grave{display:flex}
.sshop.dead .sshut{background:repeating-linear-gradient(#4b505a 0 3px,#3a3f48 3px 6px)}
.sshop.dead .sb{opacity:.5;text-decoration:line-through}
.sshop .grave .ic{width:18px;height:18px}

.guys{position:absolute;inset:0;z-index:2;pointer-events:none}
.guy{position:absolute;left:0;top:0;width:28px;height:44px;transition:transform 1.25s cubic-bezier(.45,.05,.3,1),opacity .5s}
.guy.inside{opacity:0}
.guy-svg{width:28px;height:44px;display:block;overflow:visible;animation:bob 2.6s ease-in-out infinite;animation-delay:inherit}
.guy.left .guy-svg{scale:-1 1}
.guy .lg{transform-box:fill-box;transform-origin:top center}
.guy .fedora{display:none}
.guy .fedora path{fill:#15151a;stroke:#15151a;stroke-width:1.2}
.guy.mate .fedora,.guy.me.mafia-me .fedora{display:block}
.guy.walking .guy-svg{animation:hop .32s ease-in-out infinite alternate}
.guy.walking .l1{animation:stepA .32s ease-in-out infinite alternate}
.guy.walking .l2{animation:stepB .32s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes hop{to{translate:0 -2px}}
@keyframes stepA{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes stepB{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.guy .gname{display:none;position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--paper);white-space:nowrap;text-shadow:0 1px 2px #000;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.guy.me .gname{color:var(--sig)}
.guy.me::before{content:"";position:absolute;left:50%;top:-8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--sig);animation:bob 1.4s ease-in-out infinite}
.guy .badge{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--paper);font-size:10px;font-weight:800;line-height:16px;text-align:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.guy .badge.on{transform:scale(1)}
.guy .bubble{position:absolute;bottom:50px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:var(--paper);color:#1b1b1b;font-size:10px;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1);z-index:5}
.guy.talk .bubble{opacity:1;transform:translateX(-50%) scale(1)}
.guy.speak .guy-svg{filter:drop-shadow(0 0 5px rgba(244,196,48,.9))}
.guy.out .guy-svg{animation:shake .5s ease-in-out 3;filter:drop-shadow(0 0 6px rgba(209,58,58,.9))}
@keyframes shake{25%{transform:translateX(-2px) rotate(-4deg)}75%{transform:translateX(2px) rotate(4deg)}}
.guy.me .gname,.ph-vote .guy .gname,.ph-voteResult .guy .gname{display:block}
@media (min-width:520px){.scene{margin:4px auto 12px}}
@media (prefers-reduced-motion:reduce){.guy,.sshop .sshut{transition:none}.guy-svg,.guy.walking .guy-svg,.guy.walking .lg,.sky .st,.guy.me::before{animation:none}}

.lang{display:flex;gap:0;align-self:center;border:1px solid var(--n3);border-radius:var(--r);overflow:hidden;margin:4px auto 0}
.lang button{background:transparent;border:0;color:var(--n5);font:inherit;font-weight:700;font-size:13px;padding:6px 14px;cursor:pointer}
.lang button.on{background:var(--n2);color:var(--paper)}
/* ---------- living characters ---------- */
.guy{width:36px;height:56px}
.guy-svg{width:36px;height:56px;animation:none}
.guy-svg *{transform-box:fill-box}
.guy .upper{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;animation-delay:inherit}
.guy .torso{transform-origin:50% 100%}
.guy .head{transform-origin:50% 90%;animation:tilt 7s ease-in-out infinite;animation-delay:inherit}
.guy .eyes{transform-origin:50% 50%;animation:blink 4.6s infinite;animation-delay:inherit}
.guy .pupils{animation:look 9s ease-in-out infinite;animation-delay:inherit}
.guy .armF{transform-origin:85% 5%;animation:scratch 11s ease-in-out infinite;animation-delay:inherit}
.guy .armB{transform-origin:15% 5%;animation:gesture 8s ease-in-out infinite;animation-delay:inherit}
.guy .lg{transform-origin:50% 0}
.guy .gshadow{transform-origin:50% 50%;animation:shadowB 3.2s ease-in-out infinite;animation-delay:inherit}
.guy .fedora{display:none}
.guy.mate .fedora,.guy.mafia-me .fedora{display:block}
.guy .mouth{transform-origin:50% 0}
.guy.talk .mouth,.guy.speak .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035) translateY(-.4px)}}
@keyframes shadowB{50%{transform:scaleX(.92)}}

<script>
"use strict";
/* =====================================================================
   MQTT 3.1.1 صغير فوق WebSocket (باش اللعبة تخدم أونلاين بلا سيرفر خاص)
   ===================================================================== */
// رقم النسخة: كيتزاد بوحدو ملي كنشرو أبديت (tools/publish-mafia.ps1)
const BUILD = 3;
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const TOPIC_ROOT = "mafiadarija7/v1/";
const enc = new TextEncoder(), dec = new TextDecoder();

function mqStr(s){ const b = enc.encode(s); return [b.length>>8, b.length&255, ...b]; }
function mqPkt(h, body){
  const len = []; let n = body.length;
  do { let d = n % 128; n = Math.floor(n/128); if(n>0) d |= 128; len.push(d); } while(n>0);
  const out = new Uint8Array(1+len.length+body.length);
  out[0]=h; out.set(len,1); out.set(body,1+len.length); return out;
}
class Mqtt {
  constructor(url, onMsg, onStatus){ this.url=url; this.onMsg=onMsg; this.onStatus=onStatus||(()=>{}); this.subs=new Set(); this.pid=1; this.buf=new Uint8Array(0); this.closed=false; this.ok=false; this.busy=false; this.everOk=false; this.lastRx=0; }
  connect(){
    return new Promise((res, rej)=>{
      let done=false;
      let ws;
      // محاولة ما نجحاتش: نسدوها بلا ما نقولو "الكونيكسيون مقطوعة" و بلا ما نعاودو
      const fail = (err)=>{ if(done) return; done=true; clearTimeout(to); if(ws){ ws.onclose=null; ws.onmessage=null; try{ ws.close(); }catch(e){} } rej(err); };
      const to = setTimeout(()=>fail(new Error("timeout")), 7000);
      try{ ws = new WebSocket(this.url, "mqtt"); }catch(e){ clearTimeout(to); done=true; return rej(e); }
      this.ws = ws; ws.binaryType = "arraybuffer";
      ws.onopen = ()=>{
        const cid = "mf" + Math.random().toString(36).slice(2,12);
        const body = [...mqStr("MQTT"), 4, 0x02, 0, 30, ...mqStr(cid)];
        ws.send(mqPkt(0x10, body));
      };
      ws.onmessage = (ev)=>{
        if(ws !== this.ws) return;
        this.lastRx = Date.now();
        const add = new Uint8Array(ev.data), nb = new Uint8Array(this.buf.length+add.length);
        nb.set(this.buf); nb.set(add, this.buf.length); this.buf = nb;
        this.parse((type)=>{ if(type==="connack" && !done){ done=true; clearTimeout(to); this.ok=true; this.everOk=true; this.onStatus(true); this.startPing(); res(); } });
      };
      ws.onclose = ()=>{
        if(!done){ fail(new Error("closed")); return; }
        if(ws !== this.ws) return;            // سوكيت قديم، ما يهمناش
        this.ok=false; this.stopPing();
        if(this.closed) return;               // حنا اللي سديناه
        this.onStatus(false);
        setTimeout(()=>this.reconnect(), 1000);
      };
      ws.onerror = ()=>{};
    });
  }
  async reconnect(){
    if(this.closed || this.busy || this.ok) return;
    this.busy = true;
    try{ this.buf=new Uint8Array(0); await this.connect(); this.busy=false; for(const t of this.subs) this.sendSub(t); if(this.onReconnect) this.onReconnect(); }
    catch(e){ this.busy=false; if(!this.closed) setTimeout(()=>this.reconnect(), 2500); }
  }
  // إلا السوكيت "حي" ولكن ما بقا كيجي منو والو (كيوقع فالتليفون ملي كيتخبى)، نقطعوه و نعاودو
  check(){
    if(this.closed || !this.ok) return;
    if(Date.now() - this.lastRx > 50000){ this.ok=false; this.stopPing(); const w=this.ws; this.ws=null; try{ w.onclose=null; w.close(); }catch(e){} this.onStatus(false); this.reconnect(); }
  }
  parse(cb){
    for(;;){
      const b = this.buf; if(b.length<2) return;
      let mult=1, len=0, i=1, byte;
      do { if(i>=b.length) return; byte=b[i++]; len += (byte&127)*mult; mult*=128; } while(byte&128);
      if(b.length < i+len) return;
      const type=b[0]>>4, flags=b[0]&15, body=b.subarray(i,i+len);
      this.buf = b.slice(i+len);
      if(type===2){ if(body[1]===0) cb("connack"); }
      else if(type===3){
        const tl=(body[0]<<8)|body[1]; const topic=dec.decode(body.subarray(2,2+tl));
        let p=2+tl; const qos=(flags>>1)&3; if(qos>0) p+=2;
        const payload=dec.decode(body.subarray(p));
        try{ this.onMsg(topic, payload); }catch(e){ console.error(e); }
      }
    }
  }
  sendSub(t){ const id=this.pid++&0xffff||1; if(this.ok) this.ws.send(mqPkt(0x82,[id>>8,id&255,...mqStr(t),0])); }
  subscribe(t){ this.subs.add(t); this.sendSub(t); }
  publish(t, msg, retain){ if(!this.ok) return false; this.ws.send(mqPkt(0x30|(retain?1:0), [...mqStr(t), ...enc.encode(msg)])); return true; }
  startPing(){ this.stopPing(); this.pingT=setInterval(()=>{ try{ this.ws.send(new Uint8Array([0xC0,0])); }catch(e){} this.check(); }, 15000); }
  stopPing(){ if(this.pingT) clearInterval(this.pingT); }
  close(){ this.closed=true; this.ok=false; this.stopPing(); try{ this.ws.send(new Uint8Array([0xE0,0])); this.ws.close(); }catch(e){} }
}

/* =====================================================================
   أدوات
   ===================================================================== */
const $app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function rid(n){ const a="abcdefghijkmnpqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const x of r) s+=a[x%a.length]; return s; }
function roomCode(){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(5)); for(const x of r) s+=a[x%a.length]; return s; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* =====================================================================
   الحالة ديال الكليان (كل لاعب)
   ===================================================================== */
let net = null;        // Mqtt
let ME = null;         // {room, secret, name, broker, host}
let PUB = null;        // الحالة العامة
let PRIV = null;       // الحالة الخاصة ديالي
let clockOff = 0;
let ui = {showRole:false, err:""};
let lastPhaseKey = "";
const base = r => TOPIC_ROOT + r;

// البانر ديال "الكونيكسيون مقطوعة": كيبان غير إلا الكونيكسيون الحالية طاحت فعلا و دامت أكثر من 4 ثواني
let netBannerT = null;
function setNet(ok){
  const el = document.getElementById("net");
  if(ok || !ME || !net){ clearTimeout(netBannerT); netBannerT = null; el.style.display = "none"; return; }
  if(netBannerT) return;
  netBannerT = setTimeout(()=>{ netBannerT = null; if(ME && net && !net.ok && !net.closed) el.style.display = "block"; }, 4000);
}
function netStatusFor(getM){ return ok => { if(getM() === net) setNet(ok); }; }

async function connectAny(preferred){
  const first = preferred!=null ? preferred : 0;
  const order = [first, first, ...BROKERS.map((_,i)=>i).filter(i=>i!==first)];
  for(const i of order){
    let m; m = new Mqtt(BROKERS[i], onNetMsg, netStatusFor(()=>m));
    try{ await m.connect(); return {m, i}; }catch(e){ m.closed = true; }
  }
  throw new Error("no broker");
}

function onNetMsg(topic, payload){
  if(!ME) return;
  const b = base(ME.room);
  if(topic === b+"/vall" || topic.indexOf(b+"/v/") === 0){ let m; try{ m=JSON.parse(payload); }catch(e){ return; } onVoiceMsg(m); return; }
  if(ME.host && topic === b+"/h"){ let m; try{ m=JSON.parse(payload); }catch(e){ return; } hostHandle(m); return; }
  if(ME.host) return;
  if(!payload) return;
  let d; try{ d = JSON.parse(payload); }catch(e){ return; }

}

async function clientConnect(fresh){
  loading("كنقلبو على الروم " + esc(ME.room) + "...");
  const order = ME.broker!=null ? [ME.broker, ...BROKERS.map((_,i)=>i).filter(i=>i!==ME.broker)] : BROKERS.map((_,i)=>i);
  for(const i of order){
    let m = null;
    for(let attempt=0; attempt<2 && !m; attempt++){
      const c = new Mqtt(BROKERS[i], onNetMsg, netStatusFor(()=>c));
      try{ await c.connect(); m = c; }catch(e){ c.closed = true; }
    }
    if(!m) continue;
    if(!ME) { m.close(); return; }
    net = m; PUB = null; PRIV = null;
    m.subscribe(base(ME.room)+"/all");
    m.subscribe(base(ME.room)+"/p/"+ME.secret);
    const found = await new Promise(res=>{ let n=0; const t=setInterval(()=>{ if(PUB||!ME||++n>25){ clearInterval(t); res(!!PUB); } }, 200); });
    if(!ME) return;
    if(found){
      ME.broker = i; lsSet("mafia_me", ME);
      send({t:"join", name: ME.name, av: myAv()});
      net.onReconnect = ()=>send({t:"join", name: ME.name, av: myAv()});
      startPinger();
      const ok = await new Promise(res=>{ let n=0; const t=setInterval(()=>{ if(PRIV||!net||++n>40){ clearInterval(t); res(!!PRIV); } }, 200); });
      if(!ok && net){ leave(true); if(!ui.err) ui.err = "الهوست ما جاوبش. تأكد أن اللي صاوب الروم باقي فاللعبة."; return home(); }
      return;
    }
    m.close();
  }
  net = null;
  if(!fresh) lsDel("mafia_me");
  ui.err = "ما لقيتش هاد الروم. تأكد من الكود.";
  home();
}

let G = null;
function hostCreate(name){
  G = {room: ME.room, epoch: rid(6), seq:0, phase:"lobby", round:0, players:[], hostPid:null,
       settings:{mafia:1, doctor:true, detective:true, reveal:true, day:120, night:45, vote:45},
       chat:[], mchat:[], news:[], votes:{}, ready:[], night:{mafia:{},doctor:null,det:null}, lastDoc:null, det:[], deadline:0, result:null, winner:null};
  const p = hostAdd(ME.secret, name); p.av = myAv(); G.hostPid = p.pid;
}
function hostAdd(secret, name){
  let nm = String(name||"لاعب").slice(0,16), k=2;
  while(G.players.some(p=>p.name===nm)) nm = String(name).slice(0,14)+" "+(k++);
  const p = {pid: rid(6), secret, name: nm, role:null, alive:true, seen: Date.now()};
  G.players.push(p); return p;
}
function suggestMafia(n){ return n<=5?1 : n<=8?2 : n<=12?3 : 4; }
function sys(x){ G.chat.push({sys:1, x}); if(G.chat.length>60) G.chat.splice(0, G.chat.length-60); }

function pubView(){
  const now = Date.now();
  return {room:G.room, epoch:G.epoch, seq:G.seq, now, phase:G.phase, round:G.round, hostPid:G.hostPid, settings:G.settings, deadline:G.deadline, closed:!!G.closed,
    players: G.players.map(p=>({pid:p.pid, name:p.name, av:p.av||null, alive:p.alive, on: p.secret===ME.secret || now-p.seen<35000,
      role: (G.phase==="end" || (!p.alive && G.settings.reveal)) ? p.role : null})),
    news:G.news, votes:(G.phase==="vote"||G.phase==="voteResult")?G.votes:{}, ready:G.ready, chat:G.chat.slice(-40), result:G.result, winner:G.winner};
}
function privView(p){
  const v = {pid:p.pid, role:p.role, mates:[], act:null};
  if(p.role==="mafia"){ v.mates = G.players.filter(q=>q.role==="mafia").map(q=>q.pid); v.mvotes = G.night.mafia; v.mchat = G.mchat.slice(-30); }
  if(p.role==="doctor"){ v.act = G.night.doctor; v.lastDoc = G.lastDoc; }
  if(p.role==="detective"){ v.det = G.det; }
  return v;
}
let pubTimer = null;
function hostPublish(){
  if(!G || !ME) return;
  G.seq++;
  lsSet("mafia_host", G);
  const b = base(G.room);
  const pub = pubView();
  if(net) net.publish(b+"/all", JSON.stringify(pub), true);
  for(const p of G.players){
    const pv = privView(p);
    if(p.secret === ME.secret){ PRIV = pv; }
    else if(net) net.publish(b+"/p/"+p.secret, JSON.stringify(pv), true);
  }
  PUB = pub; clockOff = 0;
  if(G.closed) return;
  draw();
}
function hostErr(secret, err){ if(net) net.publish(base(G.room)+"/p/"+secret, JSON.stringify({err}), false); }
function byPid(pid){ return G.players.find(p=>p.pid===pid); }
function aliveG(){ return G.players.filter(p=>p.alive); }

function hostHandle(m){
  if(!G || !m || !m.s) return;
  const p = G.players.find(x=>x.secret===m.s);
  if(m.t === "join"){
    if(p){ p.seen = Date.now(); if(m.av) p.av = avClean(m.av); return hostPublish(); }
    if(G.phase !== "lobby") return hostErr(m.s, "اللعبة بدات ديجا، تسنى حتى تسالي.");
    if(G.players.length >= 16) return hostErr(m.s, "الروم عامرة (16 لاعب).");
    const np = hostAdd(m.s, m.name); np.av = avClean(m.av); sys("دخل "+np.name);
    if(G.settings.mafia === suggestMafia(G.players.length-1)) G.settings.mafia = suggestMafia(G.players.length);
    return hostPublish();
  }
  if(!p) return;
  const wasOff = Date.now() - p.seen > 35000;
  p.seen = Date.now();
  const txt = String(m.x||"").trim().slice(0,200);
  switch(m.t){
    case "ping": if(wasOff) hostPublish(); return;
    case "leave":
      if(G.phase === "lobby"){ G.players = G.players.filter(x=>x!==p); sys("خرج "+p.name); }
      return hostPublish();
    case "chat":
      if(!txt) return;
      if(!(G.phase==="lobby"||G.phase==="end"||p.alive)) return;
      G.chat.push({n:p.name, x:txt}); if(G.chat.length>60) G.chat.shift(); return hostPublish();
    case "mchat":
      if(!txt || p.role!=="mafia" || !p.alive) return;
      G.mchat.push({n:p.name, x:txt}); if(G.mchat.length>40) G.mchat.shift(); return hostPublish();
    case "act": {
      if(G.phase!=="night" || !p.alive) return;
      const t = byPid(m.target); if(!t || !t.alive) return;
      if(p.role==="mafia"){ if(t.role==="mafia") return; G.night.mafia[p.pid] = t.pid; }
      else if(p.role==="doctor"){ if(t.pid===G.lastDoc) return; G.night.doctor = t.pid; }
      else if(p.role==="detective"){ if(G.night.det || t.pid===p.pid) return; G.night.det = t.pid; G.det.push({r:G.round, pid:t.pid, m: t.role==="mafia"}); }
      else return;
      if(nightDone()) return endNight();
      return hostPublish();
    }
    case "vote": {
      if(G.phase!=="vote" || !p.alive) return;
      if(m.target!=="skip"){ const t = byPid(m.target); if(!t || !t.alive || t===p) return; }
      G.votes[p.pid] = m.target;
      if(aliveG().every(x=>G.votes[x.pid]!=null)) return endVote();
      return hostPublish();
    }
    case "ready": {
      if(G.phase!=="day" || !p.alive) return;
      if(!G.ready.includes(p.pid)) G.ready.push(p.pid);
      if(G.ready.length > aliveG().length/2) return startVote();
      return hostPublish();
    }
  }
}
function hostKick(pid){
  if(G.phase!=="lobby") return; const p = byPid(pid); if(!p) return;
  if(!confirm("تخرج "+p.name+"؟")) return;
  G.players = G.players.filter(x=>x!==p); hostErr(p.secret, "الهوست خرجك من الروم.");
  if(net) net.publish(base(G.room)+"/p/"+p.secret, "", true);
  sys(""+p.name+" تخرج"); hostPublish();
}
function hostSet(k, v){
  const S = G.settings;
  if(k==="mafia") S.mafia = Math.max(1, Math.min(5, S.mafia + v));
  else if(k==="day"||k==="night"||k==="vote") S[k] = Number(v);
  else S[k] = !S[k];
  hostPublish();
}
function hostStart(){
  const n = G.players.length, S = G.settings;
  const roles = [];
  for(let i=0;i<S.mafia;i++) roles.push("mafia");
  if(S.doctor) roles.push("doctor");
  if(S.detective) roles.push("detective");
  while(roles.length < n) roles.push("citizen");
  shuffle(roles);
  G.players.forEach((p,i)=>{ p.role = roles[i]; p.alive = true; });
  G.round = 1; G.det = []; G.lastDoc = null; G.winner = null; G.result = null; G.news = [];
  G.chat = []; sys("اللعبة بدات! "+S.mafia+" مافيا بيناتكم...");
  startNight();
}
function startNight(){
  G.phase = "night"; G.night = {mafia:{}, doctor:null, det:null}; G.mchat = []; G.votes = {}; G.ready = [];
  G.deadline = Date.now() + G.settings.night*1000;
  hostPublish();
}
function nightDone(){
  const al = aliveG();
  const maf = al.filter(p=>p.role==="mafia").every(p=>G.night.mafia[p.pid]);
  const doc = al.filter(p=>p.role==="doctor").every(()=>G.night.doctor);
  const det = al.filter(p=>p.role==="detective").every(()=>G.night.det);
  return maf && doc && det;
}
function endNight(){
  const cnt = {}; Object.values(G.night.mafia).forEach(t=>cnt[t]=(cnt[t]||0)+1);
  const keys = Object.keys(cnt); let victim = null;
  if(keys.length){ const mx = Math.max(...keys.map(k=>cnt[k])); const top = keys.filter(k=>cnt[k]===mx); victim = top[Math.floor(Math.random()*top.length)]; }
  G.news = [];
  if(victim && victim !== G.night.doctor){
    const v = byPid(victim); v.alive = false;
    const r = ROLES[v.role];
    G.news.push(`<b>${esc(v.name)}</b> تقتل هاد الليلة` + (G.settings.reveal ? ` · كان ${r.name}` : ""));
    sys(""+v.name+" تقتل فالليل");
  } else {
    G.news.push(victim ? "المافيا حاولو يقتلو شي واحد، ولكن الطبيب نقذو!" : "هاد الليلة حتى واحد ما مات.");
    sys("حتى واحد ما مات هاد الليلة");
  }
  G.lastDoc = G.night.doctor;
  if(checkWin()) return hostPublish();
  G.phase = "day"; G.ready = []; G.deadline = Date.now() + G.settings.day*1000;
  hostPublish();
}
function startVote(){ G.phase = "vote"; G.votes = {}; G.deadline = Date.now() + G.settings.vote*1000; hostPublish(); }
function endVote(){
  const tally = {}; Object.values(G.votes).forEach(v=>tally[v]=(tally[v]||0)+1);
  const skip = tally.skip||0;
  const pl = Object.keys(tally).filter(k=>k!=="skip");
  let out = null, why = "none";
  if(pl.length){
    const mx = Math.max(...pl.map(k=>tally[k])); const top = pl.filter(k=>tally[k]===mx);
    if(top.length>1) why = "tie"; else if(skip >= mx) why = "skip"; else out = top[0];
  } else if(skip) why = "skip";
  if(out){ const p = byPid(out); p.alive = false; sys("المدينة خرجات "+p.name); }
  else sys("حتى واحد ما خرج فالتصويت");
  G.result = {out, why, tally};
  G.phase = "voteResult"; G.deadline = Date.now() + 9000;
  hostPublish();
}
function checkWin(){
  const al = aliveG(); const m = al.filter(p=>p.role==="mafia").length; const t = al.length - m;
  if(m===0) G.winner = "town"; else if(m>=t) G.winner = "mafia"; else return false;
  G.phase = "end"; G.deadline = 0; sys(G.winner==="mafia" ? "ربحات المافيا!" : "ربحات المدينة!");
  return true;
}
function hostForce(){
  if(!amHost()) return;
  if(G.phase==="day") startVote();
  else if(G.phase==="vote") endVote();
  else if(G.phase==="voteResult") afterResult();
}
function afterResult(){ if(checkWin()) return hostPublish(); G.round++; startNight(); }
function hostRestart(){
  G.phase="lobby"; G.round=0; G.deadline=0; G.news=[]; G.result=null; G.winner=null;
  G.players.forEach(p=>{ p.role=null; p.alive=true; });
  G.players = G.players.filter(p=>p.secret===ME.secret || Date.now()-p.seen<60000);
  hostPublish();
}
// ساعة الهوست
let lastOnline = "";
setInterval(()=>{
  if(!G || !ME || !ME.host || G.closed) return;
  const now = Date.now();
  if(G.deadline && now > G.deadline){
    if(G.phase==="night") endNight();
    else if(G.phase==="day") startVote();
    else if(G.phase==="vote") endVote();
    else if(G.phase==="voteResult") afterResult();
  }
  const on = G.players.map(p=>p.secret===ME.secret || now-p.seen<35000 ? 1 : 0).join("");
  if(on !== lastOnline){ lastOnline = on; hostPublish(); }
}, 1000);

/* =====================================================================
   الشات الصوتي (WebRTC، كل واحد متصل مباشرة مع الآخرين)
   - النهار/اللوبي: كلشي كيسمع الحيين.
   - الليل: غير المافيا كيهضرو و كيسمعو بعضياتهم. الباقين ساكتين.
   - الموتى كيسمعو فالنهار ولكن ما كيهضروش.
   ===================================================================== */
const RTC_CFG = {iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun.cloudflare.com:3478"]}]};
const V = {on:false, stream:null, track:null, muted:false, peers:{}, ctx:null, myAn:null, talk:{}};

function vMyPid(){ return PRIV && PRIV.pid; }
function vSend(to, msg){
  if(!net || !ME || !vMyPid()) return;
  msg.from = vMyPid();
  net.publish(base(ME.room) + (to ? "/v/"+to : "/vall"), JSON.stringify(msg), false);
}
async function voiceJoin(){
  if(V.on || !PRIV || !net) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ alert("هاد الجهاز ما كيدعمش الميكرو فهاد اللعبة."); return; }
  try{
    V.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false});
  }catch(e){ alert("ما قدرتش نوصل للميكرو. عطي الإذن ديال الميكرو للتطبيق و عاود."); return; }
  V.track = V.stream.getAudioTracks()[0];
  V.on = true; V.muted = false;
  try{ V.ctx = new (window.AudioContext||window.webkitAudioContext)(); V.myAn = vAnalyser(V.stream); }catch(e){}
  net.subscribe(base(ME.room)+"/vall");
  net.subscribe(base(ME.room)+"/v/"+vMyPid());
  vSend(null, {t:"hello"});
  voiceRefresh();
}
function voiceLeave(){
  if(!V.on) return;
  try{ vSend(null, {t:"bye"}); }catch(e){}
  Object.keys(V.peers).forEach(vClosePeer);
  if(V.stream) V.stream.getTracks().forEach(t=>t.stop());
  if(V.ctx) try{ V.ctx.close(); }catch(e){}
  V.on=false; V.stream=null; V.track=null; V.ctx=null; V.myAn=null; V.talk={};
  voiceRefresh();
}
function voiceToggleMute(){ V.muted = !V.muted; voiceRefresh(); }

function vAnalyser(stream){
  if(!V.ctx) return null;
  try{
    const src = V.ctx.createMediaStreamSource(stream), an = V.ctx.createAnalyser();
    an.fftSize = 512; src.connect(an);
    return {an, buf:new Uint8Array(an.fftSize)};
  }catch(e){ return null; }
}
function vLevel(a){
  if(!a) return 0; a.an.getByteTimeDomainData(a.buf);
  let s=0; for(const x of a.buf){ const d=(x-128)/128; s+=d*d; } return Math.sqrt(s/a.buf.length);
}
function vEnsurePeer(pid){
  let p = V.peers[pid];
  if(p && !["failed","closed"].includes(p.pc.connectionState)) return p;
  if(p) vClosePeer(pid);
  const pc = new RTCPeerConnection(RTC_CFG);
  const sender = pc.addTrack(V.track, V.stream);
  const audio = document.createElement("audio"); audio.autoplay = true; audio.playsInline = true;
  document.getElementById("voiceAudio").appendChild(audio);
  p = V.peers[pid] = {pc, sender, audio, an:null, pend:[], hasRemote:false, want:V.track};
  pc.onicecandidate = e => { if(e.candidate) vSend(pid, {t:"ice", c:e.candidate.toJSON()}); };
  pc.ontrack = e => { audio.srcObject = e.streams[0]; audio.play().catch(()=>{}); p.an = vAnalyser(e.streams[0]); voiceRefresh(); };
  pc.onconnectionstatechange = () => {
    if(pc.connectionState === "failed"){ vClosePeer(pid); if(vMyPid() < pid) setTimeout(()=>{ if(V.on) vCall(pid); }, 1500); }
    voiceRefresh();
  };
  vApplyPeer(pid);
  return p;
}
function vClosePeer(pid){
  const p = V.peers[pid]; if(!p) return;
  try{ p.pc.close(); }catch(e){}
  try{ p.audio.srcObject = null; p.audio.remove(); }catch(e){}
  delete V.peers[pid];
}
async function vCall(pid){
  const p = vEnsurePeer(pid);
  const offer = await p.pc.createOffer();
  await p.pc.setLocalDescription(offer);
  vSend(pid, {t:"offer", sdp:{type:p.pc.localDescription.type, sdp:p.pc.localDescription.sdp}});
}
async function vFlush(p){ p.hasRemote = true; for(const c of p.pend){ try{ await p.pc.addIceCandidate(c); }catch(e){} } p.pend = []; }
async function onVoiceMsg(m){
  if(!V.on || !m || !m.from || m.from === vMyPid()) return;
  if(PUB && !PUB.players.some(x=>x.pid===m.from)) return;
  const me = vMyPid();
  try{
    if(m.t === "hello"){
      const p = V.peers[m.from];
      if(p && !["failed","closed","disconnected"].includes(p.pc.connectionState)) return;
      if(me < m.from) vCall(m.from);
      else if(!m.d) vSend(m.from, {t:"hello", d:1});
    } else if(m.t === "offer"){
      const p = vEnsurePeer(m.from);
      await p.pc.setRemoteDescription(m.sdp); await vFlush(p);
      const ans = await p.pc.createAnswer(); await p.pc.setLocalDescription(ans);
      vSend(m.from, {t:"answer", sdp:{type:p.pc.localDescription.type, sdp:p.pc.localDescription.sdp}});
    } else if(m.t === "answer"){
      const p = V.peers[m.from]; if(!p) return;
      await p.pc.setRemoteDescription(m.sdp); await vFlush(p);
    } else if(m.t === "ice"){
      const p = V.peers[m.from]; if(!p) return;
      if(p.hasRemote){ try{ await p.pc.addIceCandidate(m.c); }catch(e){} } else p.pend.push(m.c);
    } else if(m.t === "bye"){
      vClosePeer(m.from); voiceRefresh();
    }
  }catch(e){ console.warn("voice", e); }
}
// القواعد ديال شكون يهضر مع شكون
function vPlayer(pid){ return PUB && PUB.players.find(x=>x.pid===pid); }
function vMeAlive(){ const m = PUB && vPlayer(vMyPid()); return !!(m && m.alive); }
function vOpenPhase(){ return !PUB || PUB.phase==="lobby" || PUB.phase==="end"; }
function vCanSpeak(){ if(vOpenPhase()) return true; if(!vMeAlive()) return false; return PUB.phase!=="night" || PRIV.role==="mafia"; }
function vSendTo(pid){
  if(!vCanSpeak()) return false;
  if(vOpenPhase()) return true;
  if(PUB.phase==="night") return (PRIV.mates||[]).includes(pid);
  return true;
}
function vHear(pid){
  if(vOpenPhase()) return true;
  const p = vPlayer(pid); if(!p || !p.alive) return false;
  if(PUB.phase==="night") return PRIV.role==="mafia" && vMeAlive() && (PRIV.mates||[]).includes(pid);
  return true;
}
function vApplyPeer(pid){
  const p = V.peers[pid]; if(!p || !PRIV) return;
  const want = (!V.muted && vSendTo(pid)) ? V.track : null;
  // نتبعو الحالة اللي بغينا (ماشي sender.track) حيت replaceTrack كيتأخر شوية
  if(p.want !== want){ p.want = want; p.sender.replaceTrack(want).catch(()=>{ p.want = undefined; }); }
  p.audio.muted = !vHear(pid);
}

  c.innerHTML = `<div class="board b-${tone}"><h1 class="sign">${label}</h1></div>`;

function draw(){
  if(!PUB || !PRIV || !ME) return;
  if(!me()){ return; }
  const key = PUB.phase + PUB.round;
  if(key !== lastPhaseKey){
    if(lastPhaseKey){
      vibrate(150);
      if(PUB.phase === "night") curtain("الليل طاح", "cobalt");
      else if(PUB.phase === "day") curtain("صباح الخير", "green");
    }
    lastPhaseKey = key; ui.pick = null;
    if(PUB.phase === "night" || PUB.phase === "lobby") ui.showRole = false;
  }
  ui.comp = null;
  if(ui.ward && PUB.phase === "lobby"){ setComposer(null); voiceRefresh(); sceneUpdate(); return; }
  ui.ward = false;
  switch(PUB.phase){
    case "lobby": lobbyView(); break;
    case "night": nightView(); break;
    case "day": dayView(); break;
    case "vote": voteView(); break;
    case "voteResult": voteResultView(); break;
    case "end": endView(); break;
  }
  setComposer(ui.comp);
  voiceRefresh();
  sceneUpdate();
}

const SETUP_BOX = /*ADMIN_BOX*/{"n":"admin","h":"0f0036586ae50676e93e92d36a5bf0705afc8d1f5d063ca915ce54379366ab4e","salt":"a3f71af67864d5dacfcc9dfc9ccb0ac8","iv":"737ae50bc6de24a0838c86c8","it":250000,"ct":"034616b2e511e64bdefb1c6c91e9b1598c328707bfd1b8c8b067da84f09bea3fcf884d001ef7bb94ef1601f4314bebbdf90b639225c4f02c354107679c461b3b421e12fa2af7849e4340ccba4a3b9063d0e02153b9c3487453b3d4e1cb28fb4990ab5d7a38857b4b9e85182c38"};

const accNorm = n => String(n||"").trim().replace(/\s+/g," ").toLowerCase();
const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex = s => new Uint8Array(s.match(/../g).map(x=>parseInt(x,16)));
async function sha256hex(s){ return hex(await crypto.subtle.digest("SHA-256", enc.encode(s))); }
const accHash = (n,p) => sha256hex("mafia-v1|"+accNorm(n)+"|"+p);
const regCode = h => (h.slice(0,4)+"-"+h.slice(4,8)).toUpperCase();

async function loadUsers(){
  try{
    const r = await fetch(ACC_ROOT+"users.json?t="+Date.now(), {cache:"no-store"});
    if(r.status === 404){ lsSet("mafia_users", {users:[]}); return {users:[]}; }
    const j = await r.json(); lsSet("mafia_users", j); return j;
  }catch(e){ return lsGet("mafia_users") || {users:[]}; }   // بلا أنترنيت: آخر لائحة عندنا
}
async function boxKey(pw, salt, it, use){
  const key0 = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:it, hash:"SHA-256"}, key0, {name:"AES-GCM", length:256}, false, [use]);
}
async function openBox(box, pw){
  const key = await boxKey(pw, unhex(box.salt), box.it, "decrypt");
  return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unhex(box.iv)}, key, unhex(box.ct)));
}
async function makeBox(pw, text){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), it = 250000;
  const key = await boxKey(pw, salt, it, "encrypt");
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(text));
  return {salt: hex(salt), iv: hex(iv), it, ct: hex(ct)};
}

let adminState = {users: null, sha: null, req: null, msg: ""};
async function ghGet(file){
  const r = await fetch(ACC_API + file + "?ref=main&t=" + Date.now(), {headers: {Authorization: "Bearer " + ADMIN_TOKEN, Accept: "application/vnd.github+json"}, cache: "no-store"});
  if(r.status === 404) return {data: null, sha: null};
  if(!r.ok) throw new Error("github " + r.status);
  const j = await r.json();
  const txt = dec.decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")), c=>c.charCodeAt(0)));
  return {data: JSON.parse(txt), sha: j.sha};
}
async function ghPut(file, data, sha, message){
  const bytes = enc.encode(JSON.stringify(data, null, 1));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  const body = {message, content: btoa(bin), branch: "main"}; if(sha) body.sha = sha;
  const r = await fetch(ACC_API + file, {method: "PUT", headers: {Authorization: "Bearer " + ADMIN_TOKEN, Accept: "application/vnd.github+json", "Content-Type": "application/json"}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error("github " + r.status);
  return (await r.json()).content.sha;
}
async function ghUsers(){ const g = await ghGet("users.json"); return {users: g.data || {users: []}, sha: g.sha}; }
const ghSaveUsers = (users, sha, message) => ghPut("users.json", users, sha, message);
async function adminScreen(reload){
  if(!ACC || !ACC.admin) return home();
  if(!ADMIN_TOKEN){ adminState.msg = "ما قدرتش نحل المفتاح ديال GitHub."; }
  else if(reload || !adminState.users){
    loading("كنجيبو اللائحة...");
    try{ const g = await ghUsers(); adminState.users = g.users; adminState.sha = g.sha; }
    catch(e){ adminState.msg = "ما قدرتش نجيب اللائحة: " + e.message; adminState.users = {users: []}; }
  }
  const list = (adminState.users && adminState.users.users) || [];
  const rq = adminState.req;
  render(`
    <div class="util"><span>${ic("crown")} الأدمين</span><button class="ghost" onclick="home()">رجوع</button></div>
    <header class="board b-ochre"><div class="row"><h1 class="sign">الكونطات</h1></div><div class="sub">قبل اللاعبين بالكود اللي صيفطو ليك</div></header>
    <form class="row" onsubmit="event.preventDefault();adminLookup()">
      <input type="text" id="adCode" maxlength="9" placeholder="XXXX-XXXX" aria-label="الكود" style="direction:ltr;text-align:center;letter-spacing:3px;font-weight:800;text-transform:uppercase">
      <button class="btn small sec" type="submit">${ic("lens")} قلب</button>
    </form>
    ${rq ? `<div class="panel"><p class="ask" style="margin:0 0 8px">${esc(rq.d)} <span class="muted" style="font-weight:500">· ${regCode(rq.h)}</span></p>
      <div class="row"><button class="btn green small" onclick="adminApprove()">${ic("check")} قبل</button><button class="btn sec small" onclick="adminState.req=null;adminScreen()">لا</button></div></div>` : ""}
    ${adminState.msg ? `<p class="note center">${esc(adminState.msg)}</p>` : ""}
    <p class="sec-h">${ic("users")} اللي مقبولين (${list.length})</p>
    <div class="plist">${list.map(u=>`<div class="pitem"><span class="n">${esc(u.d||u.n)}</span>
      <button class="kick" aria-label="حيد ${esc(u.d||u.n)}" onclick="adminRemove('${esc(u.n)}')">${ic("x")}</button></div>`).join("") || '<p class="note center">حتى واحد مازال.</p>'}</div>
  `);
  adminState.msg = "";
}
async function adminLookup(){
  let code = (document.getElementById("adCode").value||"").toUpperCase().replace(/[^0-9A-F]/g,"");
  if(code.length !== 8){ adminState.msg = "الكود خاصو 8 ديال الحروف."; return adminScreen(); }
  code = code.slice(0,4) + "-" + code.slice(4);
  loading("كنقلبو على الطلب...");
  let found = null, c = null;
  try{
    c = await connectAny();
    found = await new Promise(res => {
      const t = setTimeout(()=>res(null), 6000);
      c.m.onMsg = (topic, payload) => { try{ const j = JSON.parse(typeof payload === "string" ? payload : dec.decode(payload)); clearTimeout(t); res(j); }catch(e){} };
      c.m.subscribe(TOPIC_ROOT + "reg/" + code);
    });
  }catch(e){}
  if(c) c.m.close();
  if(!found || !found.h || regCode(found.h) !== code){ adminState.req = null; adminState.msg = "ما لقيت حتى طلب بهاد الكود."; }
  else adminState.req = found;
  adminScreen();
}
async function adminApprove(){
  const rq = adminState.req; if(!rq) return;
  loading("كنقبلو...");
  try{
    const g = await ghUsers();
    const list = (g.users.users || []).filter(u => u.n !== rq.n);
    list.push({n: rq.n, d: rq.d, h: rq.h, t: new Date().toISOString().slice(0,10)});
    adminState.sha = await ghSaveUsers({users: list}, g.sha, "Mafia: accept " + rq.n);
    adminState.users = {users: list}; adminState.msg = "تقبل " + rq.d + ". دابا يقدر يدخل.";
    try{ const c = await connectAny(); c.m.publish(TOPIC_ROOT + "reg/" + regCode(rq.h), "", true); setTimeout(()=>c.m.close(), 1500); }catch(e){}
  }catch(e){ adminState.msg = "ما تقبلش: " + e.message; }
  adminState.req = null; adminScreen();
}
async function adminRemove(n){
  if(!confirm("تحيد هاد الكونط؟ ما بقاش يقدر يدخل.")) return;
  loading("كنحيدو...");
  try{
    const g = await ghUsers();
    const list = (g.users.users || []).filter(u => u.n !== n);
    adminState.sha = await ghSaveUsers({users: list}, g.sha, "Mafia: remove " + n);
    adminState.users = {users: list}; adminState.msg = "تحيد.";
  }catch(e){ adminState.msg = "ما تحيدش: " + e.message; }
  adminScreen();
}

const AV_MAX = {s:6, h:6, c:5, o:6, t:6, g:2, b:2};
function avOf(av, i){
  const d = {s: i % 6, h: (i*5+1) % 6, c: (i*3) % 5, o: i % 4, t: [0,1,0,2,0,3][i % 6], g: i % 7 === 5 ? 1 : 0, b: i % 5 === 2 ? 1 : 0};
  const o = {};
  for(const k in AV_MAX){ const v = av && Number.isInteger(av[k]) ? av[k] : d[k]; o[k] = Math.max(0, Math.min(AV_MAX[k]-1, v)); }
  return o;
}
function avClean(av){ if(!av || typeof av !== "object") return null; const o = {}; for(const k in AV_MAX){ const v = Number(av[k]); if(Number.isInteger(v) && v >= 0 && v < AV_MAX[k]) o[k] = v; } return o; }

function sceneBuild(el){
  el.innerHTML = guyDefs() + `
    <div class="sky"><span class="cloud c1"></span><span class="cloud c2"></span><span class="moon"></span><span class="sun"></span><i class="st s1"></i><i class="st s2"></i><i class="st s3"></i></div>

      <div class="hall-sign"><span class="sign">الجماعة</span></div>
      <div class="hall-body"><span class="arch"></span><span class="table"></span><span class="lamp"></span></div>
    </div>
    <div class="shops"></div><div class="guys"></div>`;
  SC.built = true; SC.pl = {};
}
function sceneSlot(i, n, W, H){
  const top = Math.ceil(n/2), row = i < top ? 0 : 1, k = row ? i - top : i, cnt = row ? n - top : top;
  const sw = W / Math.max(cnt, 1);
  return {row, x: k*sw, w: sw, y: row ? H - 64 : 0};
}
function sceneUpdate(){
  const el = document.getElementById("scene");
  if(!PUB || !PRIV || !ME || !me()){ el.style.display = "none"; return; }
  el.style.display = "block";
  if(!SC.built) sceneBuild(el);
  const W = el.clientWidth || 340, H = el.clientHeight || 250; SC.W = W;
  const ph = PUB.phase;
  el.className = "scene ph-" + ph;
  const ps = PUB.players, n = ps.length;
  const shopsEl = el.querySelector(".shops"), guysEl = el.querySelector(".guys");
  const gather = ph === "vote" || ph === "voteResult";
  const alive = ps.filter(p=>p.alive);
  const votes = PUB.votes || {};
  const mates = PRIV.role === "mafia" ? (PRIV.mates||[]) : [];
  const seen = {};
  ps.forEach((p, i) => {
    seen[p.pid] = 1;
    let s = SC.pl[p.pid];
    if(!s){
      const shop = document.createElement("div"); shop.className = "sshop";
      shop.innerHTML = `<span class="sb" translate="no"></span><span class="sdoor"><span class="grave">${ic("grave")}</span></span><span class="sshut"></span>`;
      shopsEl.appendChild(shop);
      const guy = document.createElement("div"); guy.className = "guy";
      guy.innerHTML = `<span class="bubble" translate="no"></span><span class="badge"></span>${guySvg(i)}<span class="gname" translate="no"></span>`;
      guy.dataset.av = "";
      guysEl.appendChild(guy);
      s = SC.pl[p.pid] = {shop, guy, x: null, y: null, walkT: null, bubT: null};
    }
    const avKey = i + JSON.stringify(p.av||null);
    if(s.guy.dataset.av !== avKey){ s.guy.dataset.av = avKey; s.guy.querySelector(".guy-svg").outerHTML = guySvg(i, p.av); }
    const sl = sceneSlot(i, n, W, H);
    s.shop.style.cssText = `left:${sl.x+2}px;top:${sl.y}px;width:${sl.w-4}px`;
    s.shop.className = `sshop c-${TONES[i%4]} ${(ph==="night" || !p.alive) ? "shut" : ""} ${p.alive ? "" : "dead"}`;
    s.shop.querySelector(".sb").textContent = p.name;
    // where the character stands
    let tx, ty, inside = false;
    const doorX = sl.x + sl.w/2 - 18;
    if(!p.alive){ tx = doorX; ty = sl.row ? sl.y + 14 : sl.y + 14; inside = true; }
    else if(ph === "night"){ tx = doorX; ty = sl.row ? sl.y + 14 : sl.y + 14; inside = true; }
    else if(gather){
      const j = alive.indexOf(p), m = Math.max(alive.length, 1);
      const a = ((j + .5) / m) * Math.PI * 2 - Math.PI/2;
      tx = W/2 - 18 + Math.cos(a) * Math.min(W*0.33, 135);
      ty = H/2 - 36 + Math.sin(a) * 30;
    } else { tx = doorX; ty = sl.row ? sl.y - 56 : sl.y + 58; }
    const g = s.guy;
    if(s.x !== null && (Math.abs(s.x - tx) > 2 || Math.abs(s.y - ty) > 2)){
      g.classList.add("walking");
      g.classList.toggle("left", tx < s.x);
      clearTimeout(s.walkT); s.walkT = setTimeout(()=>g.classList.remove("walking"), 1300);
    }
    s.x = tx; s.y = ty;
    g.style.transform = `translate(${tx}px,${ty}px)`;
    g.style.animationDelay = (-i * 0.37) + "s";
    g.classList.toggle("inside", inside);
    g.classList.toggle("me", p.pid === PRIV.pid);
    g.classList.toggle("mafia-me", p.pid === PRIV.pid && PRIV.role === "mafia");
    g.classList.toggle("mate", mates.includes(p.pid) && p.pid !== PRIV.pid);
    g.classList.toggle("out", ph === "voteResult" && PUB.result && PUB.result.out === p.pid);
    g.querySelector(".gname").textContent = p.pid === PRIV.pid ? (LANG==="fr" ? "toi" : "انت") : p.name;
    const vc = ph === "vote" ? Object.values(votes).filter(v=>v===p.pid).length : 0;
    const b = g.querySelector(".badge"); b.textContent = vc || ""; b.classList.toggle("on", vc > 0);
  });
  for(const pid of Object.keys(SC.pl)) if(!seen[pid]){ SC.pl[pid].shop.remove(); SC.pl[pid].guy.remove(); delete SC.pl[pid]; }
  // speech bubbles for new chat messages
  const chat = PUB.chat || [];
  if(chat.length < SC.lastChat) SC.lastChat = 0;
  for(const m of chat.slice(SC.lastChat)){
    if(m.sys || !SC.lastChat && chat.length > 3) continue;
    const p = ps.find(x=>x.name===m.n); const s = p && SC.pl[p.pid]; if(!s) continue;
    const bub = s.guy.querySelector(".bubble");
    bub.textContent = m.x.length > 34 ? m.x.slice(0,33) + "…" : m.x;
    s.guy.classList.add("talk"); clearTimeout(s.bubT);
    s.bubT = setTimeout(()=>s.guy.classList.remove("talk"), 3800);
  }
  SC.lastChat = chat.length;
}

}, 200);

// جمل فيها سميات ولا أرقام
const FR_RX = [
  [/^دخل (.+)$/, "$1 est arrivé"], [/^خرج (.+)$/, "$1 est parti"], [/^(.+) تخرج$/, "$1 a été retiré"],
  [/^النهار (\d+)$/, "Jour $1"], [/^الليلة (\d+)$/, "Nuit $1"], [/^الليلة (\d+):/, "Nuit $1 :"],
  [/^(\d+) مافيا بيناتكم\.\.\.$/, "$1 mafieux parmi vous..."], [/^حيد (.+)$/, "Supprimer $1"],
  [/^كود التسجيل ديالي ف مافيا: (.+)$/, "Mon code d'inscription Mafia : $1"]
];
const FR_KEYS = Object.keys(FR).filter(k => k.length >= 4).sort((a,b)=>b.length-a.length);
function trText(t){
  if(LANG !== "fr" || !t || !/[؀-ۿ]/.test(t)) return t;
  const core = t.trim();
  if(FR[core] !== undefined) return t.replace(core, FR[core]);
  for(const [rx, to] of FR_RX){ if(rx.test(core)) return t.replace(core, core.replace(rx, to)); }
  let out = t;
  for(const k of FR_KEYS) if(out.includes(k)) out = out.split(k).join(FR[k]);
  return out;
}
function trNode(root){
  if(LANG !== "fr") return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){ const p = n.parentNode; if(p && (p.nodeName === "SCRIPT" || p.nodeName === "STYLE")) continue; if(p && p.closest && p.closest('[translate="no"]')) continue; const v = trText(n.nodeValue); if(v !== n.nodeValue) n.nodeValue = v; }
  const els = root.querySelectorAll ? root.querySelectorAll("[placeholder],[aria-label],[title]") : [];
  for(const e of els) for(const a of ["placeholder","aria-label","title"]){ const v = e.getAttribute(a); if(v){ const t = trText(v); if(t !== v) e.setAttribute(a, t); } }
}
const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
window.alert = m => _alert(trText(String(m)));
window.confirm = m => _confirm(trText(String(m)));
let trBusy = false;
const trObs = new MutationObserver(ms => {
  if(LANG !== "fr" || trBusy) return;
  trBusy = true;
  for(const m of ms){
    const pe = m.target.nodeType === 1 ? m.target : m.target.parentNode;
    if(pe && pe.closest && pe.closest('[translate="no"]')) continue;
    if(m.type === "characterData") { const v = trText(m.target.nodeValue); if(v !== m.target.nodeValue) m.target.nodeValue = v; }
    else m.addedNodes.forEach(nd => nd.nodeType === 3 ? (nd.nodeValue = trText(nd.nodeValue)) : nd.nodeType === 1 && trNode(nd));
  }
  trBusy = false;
});
function applyLang(){
  document.documentElement.lang = LANG === "fr" ? "fr" : "ar";
  document.documentElement.dir = LANG === "fr" ? "ltr" : "rtl";
  document.title = LANG === "fr" ? "Mafia" : "مافيا";
  trObs.disconnect();
  if(LANG === "fr"){ trNode(document.body); trObs.observe(document.body, {childList:true, subtree:true, characterData:true}); }
}
const STATIC_HTML = {};
["net","composer"].forEach(id => { const e = document.getElementById(id); if(e) STATIC_HTML[id] = e.innerHTML; });
function setLang(l){
  LANG = l; lsSet("mafia_lang", l);
  for(const id in STATIC_HTML){ const e = document.getElementById(id); if(e){ const v = e.querySelector("input") ? e.querySelector("input").value : ""; e.innerHTML = STATIC_HTML[id]; const i = e.querySelector("input"); if(i) i.value = v; } }
  applyLang();
  lastHtml = ""; vLastBtns = ""; SC.built = false;
  ACC ? home() : loginScreen();
}
function langSwitch(){
  return `<div class="lang" role="group" aria-label="اللغة / Langue">
    <button class="${LANG==="ar"?"on":""}" onclick="setLang('ar')" lang="ar">الدارجة</button>
    <button class="${LANG==="fr"?"on":""}" onclick="setLang('fr')" lang="fr">Français</button></div>`;
}
applyLang();

/* ---------- الدرب حي: طيور فالنهار، خفافيش فالليل، مش كيدوز، سحاب كيتحرك ---------- */
const AMB = {t:null};
const BIRD = `<svg viewBox="0 0 30 14" class="flap"><path d="M1 7c4-5 9-5 14 1 5-6 10-6 14-1-4-1.5-9 0-14 4-5-4-10-5.5-14-4z" fill="#22252d"/></svg>`;
const BAT = `<svg viewBox="0 0 40 18" class="flap"><path d="M20 6c1.3 0 2 .9 2 2 2-4 7-6 12-6-1.4 1.6-1.6 3.2-1 4.6-1.6-.4-3 0-3.8 1.4-1.2-.8-2.8-.6-3.6.6C24 10 22 12 20 14c-2-2-4-4-5.6-5.4-.8-1.2-2.4-1.4-3.6-.6-.8-1.4-2.2-1.8-3.8-1.4.6-1.4.4-3-1-4.6 5 0 10 2 12 6 0-1.1.7-2 2-2z" fill="#0a0a0e"/><circle cx="18.8" cy="8" r=".6" fill="#f4c430"/><circle cx="21.2" cy="8" r=".6" fill="#f4c430"/></svg>`;
const CAT = `<svg viewBox="0 0 46 26"><g class="cat-tail"><path d="M6 14C1 12 1 5 5 3" stroke="#2b2b30" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <ellipse cx="20" cy="15" rx="13" ry="6.5" fill="#2b2b30"/><circle cx="35" cy="10" r="6" fill="#2b2b30"/><path d="M31 6l1-5 3 4zM36 5l3-4 1 5z" fill="#2b2b30"/>
  <circle cx="36.6" cy="9.4" r="1" fill="#f4c430"/><g class="cat-legs" stroke="#2b2b30" stroke-width="3" stroke-linecap="round"><path class="cl1" d="M12 19v5"/><path class="cl2" d="M27 19v5"/></g></svg>`;
function ambSpawn(){
  const el = document.getElementById("scene");
  if(!el || el.style.display === "none" || document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const night = el.classList.contains("ph-night");
  const r = Math.random();
  const a = document.createElement("div");
  const rtl = Math.random() < .5;
  if(r < .62){
    // طير ولا خفاش كيدوز فالسما
    a.className = "amb flyer " + (night ? "bat" : "bird") + (rtl ? " rtl" : "");
    a.innerHTML = night ? BAT : BIRD;
    a.style.top = (40 + Math.random()*90) + "px";
    a.style.animationDuration = (night ? 5 + Math.random()*3 : 6 + Math.random()*4) + "s";
    if(!night && Math.random() < .4){ const b = a.cloneNode(true); b.style.top = (parseFloat(a.style.top) + 12) + "px"; b.style.animationDelay = ".35s"; el.appendChild(b); b.addEventListener("animationend", e=>{ if(e.target === b) b.remove(); }); setTimeout(()=>b.remove(), 20000); }
  } else {
    // مش كيتمشى فالزنقة
    a.className = "amb cat" + (rtl ? " rtl" : "");
    a.innerHTML = CAT;
    a.style.top = (el.clientHeight/2 + 40 + Math.random()*12) + "px";
    a.style.animationDuration = (11 + Math.random()*5) + "s";
  }
  el.appendChild(a);
  a.addEventListener("animationend", e=>{ if(e.target === a) a.remove(); });
  setTimeout(()=>a.remove(), 20000);
}
function ambLoop(){
  clearTimeout(AMB.t);
  ambSpawn();
  AMB.t = setTimeout(ambLoop, 5000 + Math.random()*9000);
}
setTimeout(ambLoop, 3000);
